name: SoloPocket
options:
  bundleIdPrefix: com.tom.solo
  deploymentTarget:
    iOS: "17.0"
packages:
  SoloCore:
    path: .
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    GOOGLE_CLIENT_ID: ""
    GOOGLE_REVERSED_CLIENT_ID: "solo-pocket-unconfigured"
    PRODUCT_BUNDLE_IDENTIFIER: com.tom.solo.pocket
    GENERATE_INFOPLIST_FILE: NO
targets:
  SoloPocket:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - App
      - path: Tests/SoloCoreTests/Fixtures/sessions.csv
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Solo Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: 连接你的 Solo 2，读取 session 列表并将所选记录下载到手机。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    dependencies:
      - package: SoloCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
schemes:
  SoloPocket:
    build:
      targets:
        SoloPocket: all
